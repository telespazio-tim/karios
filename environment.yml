name: karios
channels:
  - conda-forge
dependencies:
  - pip
  - gdal=3.8.*
  - matplotlib-base=3.8.*
  - opencv=4.8.*
  - pandas=2.1.*
  - python=3.12
  # Test-only (tests/end_to_end/test_karios_with_rasterio.py): conda-installed like
  # gdal itself, so it links the same native GDAL rather than a pip wheel's own
  # bundled copy, which can otherwise crash or misresolve PROJ data in-process
  # alongside karios's own osgeo.gdal usage.
  - rasterio=1.3.*
  - scikit-image=0.24.*
  - rich-click=1.8.*
  # Pinned below 8.2: newer click releases require Python >=3.10, which
  # would silently make this environment unreproducible on the >=3.9 this
  # project otherwise supports (see requires-python in pyproject.toml).
  # rich-click itself only requires click>=7.
  - click=8.1.*
